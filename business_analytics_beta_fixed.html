<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Analytics — Beta</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#F4F6FA;background:#171B22;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.shell{display:flex;min-height:100vh}.sidebar{width:225px;flex-shrink:0;background:#202631;border-right:1px solid #3C4553;padding:28px 16px}.brand{font-weight:750;font-size:17px;color:#F4F6FA;letter-spacing:-.5px;margin:0 0 36px}.brand b{color:#82AFFF}.nav{display:block;width:100%;text-align:left;padding:13px;border:0;border-radius:9px;background:transparent;color:#A6B1C0;margin-bottom:7px}.nav.active{background:#303C50;color:#82AFFF}.main{flex:1;min-width:0}.top{height:75px;border-bottom:1px solid #3C4553;display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:12px}.top strong{font-size:16px}.content{padding:28px 30px;max-width:1450px;margin:auto}.btn{border:0;border-radius:9px;padding:11px 16px;background:#4F82ED;color:white;font-weight:650}.btn.secondary{background:#303C50;color:#E2E8F4}.btn.danger{background:#69313A;color:#FFD6D6}.btn.ghost{background:transparent;border:1px solid #4D586A;color:#E3E8F1}.btn.small{padding:7px 10px;font-size:12px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px}h1{font-size:25px;margin:0 0 5px;letter-spacing:-.7px}h2{font-size:16px;margin:0}.muted{color:#A6B1C0}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:#262D38;border:1px solid #3C4553;border-radius:13px;padding:20px;min-width:0}.card .value{font-size:32px;font-weight:750;letter-spacing:-1px;margin:13px 0 5px}.card .label{color:#A6B1C0;font-size:13px}.subboxes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:-5px -5px 15px}.subbox{background:#333F51;border-radius:8px;padding:9px;text-align:center}.subbox span{display:block;color:#A6B1C0;font-size:11px}.subbox b{display:block;font-size:20px;margin-top:3px}.seg{display:flex;gap:3px;background:#1B222D;border-radius:8px;padding:3px}.seg button{border:0;background:transparent;color:#A6B1C0;padding:6px 9px;border-radius:6px;font-size:11px}.seg button.active{background:#4F82ED;color:white}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.lower{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-top:16px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}select,input{background:#1B222D;border:1px solid #465164;color:#F4F6FA;border-radius:8px;padding:10px;width:100%;min-width:0}select:focus,input:focus{outline:2px solid #82AFFF;outline-offset:1px}.controls select{width:auto;max-width:220px}table{width:100%;border-collapse:collapse;text-align:left}th{color:#A6B1C0;font-size:11px;font-weight:600}td,th{padding:12px 9px;border-bottom:1px solid #3C4553}td{font-size:12px}.tablewrap{overflow-x:auto}.empty{color:#A6B1C0;padding:25px 5px;text-align:center}.pill{border-radius:30px;padding:4px 8px;background:#34445B;color:#C7DBFF;font-size:11px}.chart{width:100%;height:240px;display:block}.chartnote{color:#A6B1C0;font-size:11px;margin-top:5px}.tabs{display:flex;gap:7px}.tabs button{border:0;border-radius:7px;padding:8px 11px;background:#1B222D;color:#A6B1C0}.tabs button.active{background:#3B4B63;color:white}.modalshade{position:fixed;inset:0;background:#000a;display:flex;justify-content:flex-end;align-items:flex-start;z-index:20}.modal{background:#262D38;width:min(480px,100%);height:100vh;overflow-y:auto;box-shadow:-12px 0 40px #0007;padding:24px;border-left:1px solid #4D586A}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.modalhead h2{font-size:21px}.close{border:0;background:transparent;color:#A6B1C0;font-size:27px}.field{margin-bottom:14px}.field label{display:block;color:#C1CAD7;font-size:12px;margin-bottom:6px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.section{color:#82AFFF;font-weight:700;margin:22px 0 12px;border-top:1px solid #465164;padding-top:18px}.radio{display:flex;gap:8px;margin-bottom:18px}.radio button{flex:1;border:1px solid #4D586A;background:#1B222D;color:#C8D2E0;border-radius:9px;padding:12px}.radio button.active{border-color:#82AFFF;background:#303F58;color:white}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.note{color:#A6B1C0;font-size:12px;line-height:1.55}.footer{color:#8C9AAD;font-size:11px;margin-top:26px}.check{width:17px;height:17px;accent-color:#4F82ED}.mobile-nav{display:none}.nowrap{white-space:nowrap}.status{color:#65D2A4}.status.lost{color:#FF8B8B}

</style></head><body><div id="app"><main style="max-width:920px;margin:45px auto;padding:24px;color:#F4F6FA;font-family:-apple-system,Arial,sans-serif"><h1 style="color:#82AFFF">Business Analytics</h1><p>Graphite &amp; Blue beta</p><section style="background:#262D38;border-radius:14px;padding:22px;margin-top:20px"><h2>Dashboard</h2><p>This file preview may not run interactive JavaScript. Open the HTML file in a full web browser to use the interactive beta.</p><p>Dashboard · Client Portfolio · New Client · Milestones</p></section></main></div><script>
'use strict';const KEY='graphite_blue_business_beta_v1';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};const today=()=>iso(new Date());const date=s=>new Date(s+'T12:00:00');const addMonths=(s,n)=>{let d=date(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);let end=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,end));return iso(d)};const money=n=>'$'+(n||0).toLocaleString('en-US',{maximumFractionDigits:2,minimumFractionDigits:0});const fmt=s=>date(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const fresh=()=>({clients:[],milestones:{},history:[]});let data;try{data=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{data=fresh()}data.clients??=[];data.milestones??={};data.history??=[];let tab='dashboard',modal=null,editing=null,periods={churn:'month',growth:'month'},graphRange='30',graphMetric='revenue',milestoneTab='upcoming',showInactive=false,search='';const persist=()=>localStorage.setItem(KEY,JSON.stringify(data));const active=c=>!c.lostDate;const activeAt=(c,d)=>c.startDate<=d&&(!c.lostDate||c.lostDate>d);const activeClients=()=>data.clients.filter(active);const mrr=c=>c.type==='recurring'?c.payment*({weekly:52/12,biweekly:26/12,monthly:1}[c.billing]||1):0;const hours=c=>(c.sessions||0)*(c.minutes||0)/60*2;const startOf=p=>{let d=new Date(),y=d.getFullYear(),m=d.getMonth();return p==='month'?iso(new Date(y,m,1)):p==='quarter'?iso(new Date(y,Math.floor(m/3)*3,1)):iso(new Date(y,0,1))};const growth=p=>{let s=startOf(p),t=today();return data.clients.filter(c=>c.startDate>=s&&c.startDate<=t).length-data.clients.filter(c=>c.lostDate&&c.lostDate>=s&&c.lostDate<=t).length};const churn=p=>{let s=startOf(p),t=today(),start=new Date(date(s).getTime()-86400000),base=data.clients.filter(c=>activeAt(c,iso(start))).length,lost=data.clients.filter(c=>c.lostDate&&c.lostDate>=s&&c.lostDate<=t).length;return base?100*lost/base:null};const segmented=(kind)=>`<div class="seg">${[['month','Month'],['quarter','Quarter'],['ytd','YTD']].map(([v,l])=>`<button data-period="${kind}:${v}" class="${periods[kind]===v?'active':''}">${l}</button>`).join('')}</div>`;
function milestones(){let arr=[];for(let c of data.clients){if(!active(c))continue;let nextAdded=false;for(let [n,label] of [[3,'3 mo.'],[6,'6 mo.'],[12,'1 year']]){let key=c.id+'_'+n,d=addMonths(c.startDate,n),completed=data.milestones[key];if(completed?.date){arr.push({key,name:c.name,label,date:d,completed:completed.date})}else if(!nextAdded){arr.push({key,name:c.name,label,date:d,completed:null});nextAdded=true}}}return arr}
function render(){let ac=activeClients(),rec=ac.filter(c=>c.type==='recurring'),pif=ac.filter(c=>c.type==='pif'),revenue=rec.reduce((s,c)=>s+mrr(c),0),total=ac.reduce((s,c)=>s+hours(c),0),ch=churn(periods.churn),gr=growth(periods.growth);$('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><b>◈</b> Business Analytics</div><button class="nav ${tab==='dashboard'?'active':''}" data-tab="dashboard">▦ &nbsp; Dashboard</button><button class="nav ${tab==='portfolio'?'active':''}" data-tab="portfolio">♙ &nbsp; Client Portfolio</button></aside><div class="main"><header class="top"><strong>Business Analytics <span class="muted small">/ Beta</span></strong><button class="btn" data-action="new">+ New Client</button></header><main class="content">${tab==='dashboard'?`<div class="head"><div><h1>Business Overview</h1><div class="muted">Your performance at a glance</div></div></div><section class="grid"><div class="card"><div class="label">Biweekly Training Hours</div><div class="value">${total.toFixed(1)}</div><div class="small muted">Weekly scheduled hours × 2</div></div><div class="card"><div class="subboxes"><div class="subbox"><span>PIF Clients</span><b>${pif.length}</b></div><div class="subbox"><span>Recurring Clients</span><b>${rec.length}</b></div></div><div class="label">Total Active Clients</div><div class="value">${ac.length}</div></div><div class="card"><div class="cardhead"><span class="label">Client Churn Rate</span>${segmented('churn')}</div><div class="value">${ch===null?'—':ch.toFixed(1)+'%'}</div><div class="small muted">${ch===null?'No clients at period start':'Lost clients ÷ clients at period start'}</div></div><div class="card"><div class="label">Monthly Recurring Revenue</div><div class="value">${money(revenue)}</div><div class="small muted">Excludes all PIF payments</div></div><div class="card"><div class="cardhead"><span class="label">Net Client Growth</span>${segmented('growth')}</div><div class="value" style="color:${gr<0?'#FF8B8B':'#65D2A4'}">${gr>0?'+':''}${gr}</div><div class="small muted">New clients − clients lost</div></div></section><div class="lower"><section class="card"><div class="panelhead"><h2>Growth Trend</h2><div class="controls"><select id="metric"><option value="revenue" ${graphMetric==='revenue'?'selected':''}>Monthly Recurring Revenue</option><option value="growth" ${graphMetric==='growth'?'selected':''}>Net Client Growth</option><option value="hours" ${graphMetric==='hours'?'selected':''}>Biweekly Training Hours</option></select><select id="range"><option value="7" ${graphRange==='7'?'selected':''}>7 days</option><option value="30" ${graphRange==='30'?'selected':''}>30 days</option><option value="90" ${graphRange==='90'?'selected':''}>90 days</option><option value="365" ${graphRange==='365'?'selected':''}>1 year</option></select></div></div><div id="chart"></div><div class="chartnote" id="chartnote"></div></section><section class="card"><div class="panelhead"><h2>Milestone Tracker</h2><div class="tabs"><button data-milestone="upcoming" class="${milestoneTab==='upcoming'?'active':''}">Upcoming</button><button data-milestone="completed" class="${milestoneTab==='completed'?'active':''}">Completed</button></div></div><div class="tablewrap">${milestoneTable()}</div></section></div>`:portfolioHTML()}<div class="footer">Beta preview · Stored in this browser only · Do not enter real client data until secure cloud storage and backups are configured.</div></main></div></div><nav class="mobile-nav"><button class="nav ${tab==='dashboard'?'active':''}" data-tab="dashboard">Dashboard</button><button class="nav ${tab==='portfolio'?'active':''}" data-tab="portfolio">Client Portfolio</button></nav>${modal?modalHTML():''}`;bind();if(tab==='dashboard')drawChart()}
function milestoneTable(){let arr=milestones().filter(x=>milestoneTab==='completed'?!!x.completed:!x.completed).sort((a,b)=>milestoneTab==='completed'?b.completed.localeCompare(a.completed):a.date.localeCompare(b.date));if(!arr.length)return `<div class="empty">No ${milestoneTab} milestones.</div>`;return `<table><thead><tr><th>Name</th><th>Milestone</th><th>Due</th><th>${milestoneTab==='completed'?'Completed':'Gift Given'}</th></tr></thead><tbody>${arr.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.label}</td><td class="nowrap">${fmt(x.date)}</td><td>${x.completed?fmt(x.completed):`<input class="check" type="checkbox" data-complete="${x.key}" aria-label="Mark gift given to ${esc(x.name)}">`}</td></tr>`).join('')}</tbody></table>`}
function portfolioHTML(){let cs=data.clients.filter(c=>(showInactive||active(c))&&c.name.toLowerCase().includes(search.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));return `<div class="head"><div><h1>Client Portfolio</h1><div class="muted">${activeClients().length} active clients</div></div></div><section class="card"><div class="panelhead"><input style="max-width:320px" id="search" placeholder="Search clients..." value="${esc(search)}"><label class="small muted"><input id="inactive" type="checkbox" ${showInactive?'checked':''} style="width:auto"> Show former clients</label></div><div class="tablewrap"><table><thead><tr><th>Client</th><th>Type</th><th>Package</th><th>Monthly Recurring</th><th>Start Date</th><th>Status</th><th>Actions</th></tr></thead><tbody>${cs.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${c.type==='pif'?'PIF':'Recurring'}</td><td>${c.sessions}× ${c.minutes} min/wk</td><td>${c.type==='pif'?'—':money(mrr(c))}</td><td class="nowrap">${fmt(c.startDate)}</td><td><span class="status ${c.lostDate?'lost':''}">${c.lostDate?'Lost':'Active'}</span></td><td class="nowrap"><button class="btn small secondary" data-edit="${c.id}">Edit</button> ${!c.lostDate?`<button class="btn small danger" data-lost="${c.id}">Client Lost</button>`:''}</td></tr>`).join('')}</tbody></table>${!cs.length?'<div class="empty">No clients found. Use + New Client to get started.</div>':''}</div></section>`}
function modalHTML(){let c=editing||{name:'',startDate:today(),type:'recurring',sessions:3,minutes:30,payment:0,billing:'monthly',contract:3,source:'kickoff',pifExpiration:''};if(modal==='lost')return `<div class="modalshade"><div class="modal"><div class="modalhead"><h2>Client Lost</h2><button class="close" data-close>×</button></div><p class="note">Mark ${esc(c.name)} as lost. Their current and future milestones will be removed, while historical records remain available.</p><form id="lostform"><div class="field"><label>Cancellation date</label><input name="lostDate" type="date" value="${today()}" min="${c.startDate}" max="${today()}" required></div><div class="actions"><button type="button" class="btn secondary" data-close>Cancel</button><button class="btn danger" type="submit">Confirm Client Lost</button></div></form></div></div>`;return `<div class="modalshade"><div class="modal"><div class="modalhead"><h2>${editing?'Update Client':'New Client'}</h2><button class="close" data-close>×</button></div><form id="clientform"><div class="field"><label>Full Name</label><input name="name" value="${esc(c.name)}" required maxlength="100" placeholder="Client name"></div><div class="twocol"><div class="field"><label>Start Date</label><input type="date" name="startDate" value="${c.startDate}" max="${today()}" required></div><div class="field"><label>Acquisition Source</label><select name="source">${[['kickoff','CrunchONE Kickoff'],['referral','Referral'],['floor','Gym Floor'],['outreach','Outreach'],['other','Other']].map(([v,l])=>`<option value="${v}" ${c.source===v?'selected':''}>${l}</option>`).join('')}</select></div></div><div class="section">Training Package</div><div class="twocol"><div class="field"><label>Sessions per Week</label><select name="sessions">${[0,1,2,3,4,5,6,7].map(v=>`<option value="${v}" ${c.sessions==v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Minutes per Session</label><select name="minutes">${[0,30,45,60,90,120].map(v=>`<option value="${v}" ${c.minutes==v?'selected':''}>${v} minutes</option>`).join('')}</select></div></div><div class="section">Payment Type</div><div class="radio"><button type="button" data-type="recurring" class="${c.type==='recurring'?'active':''}">Recurring</button><button type="button" data-type="pif" class="${c.type==='pif'?'active':''}">Paid in Full (PIF)</button></div><input type="hidden" name="type" value="${c.type}"><div id="paymentfields">${paymentFields(c)}</div><div class="actions"><button type="button" class="btn secondary" data-close>Cancel</button><button class="btn" type="submit">${editing?'SAVE CHANGES':'ADD'}</button></div></form></div></div>`}
function paymentFields(c){return c.type==='recurring'?`<div class="section">Recurring Client</div><div class="twocol"><div class="field"><label>Payment Amount ($)</label><input name="payment" type="number" min="0" step="0.01" value="${c.payment}" required></div><div class="field"><label>Billing Frequency</label><select name="billing">${[['weekly','Weekly'],['biweekly','Every 2 weeks'],['monthly','Monthly']].map(([v,l])=>`<option value="${v}" ${c.billing===v?'selected':''}>${l}</option>`).join('')}</select></div></div><div class="field"><label>Contract Length</label><select name="contract">${[[0,'Month to month'],[3,'3 months'],[6,'6 months'],[12,'12 months']].map(([v,l])=>`<option value="${v}" ${c.contract==v?'selected':''}>${l}</option>`).join('')}</select></div>`:`<div class="section">Paid in Full Client</div><div class="field"><label>Total Package Price ($)</label><input name="payment" type="number" min="0" step="0.01" value="${c.payment}" required></div><div class="field"><label>Package Expiration Date (optional)</label><input name="pifExpiration" type="date" value="${c.pifExpiration||''}"></div><p class="note">PIF payments do not contribute to Monthly Recurring Revenue. PIF clients remain active until marked lost; expiration is recorded for reference.</p>`}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{let [k,v]=b.dataset.period.split(':');periods[k]=v;render()});document.querySelectorAll('[data-milestone]').forEach(b=>b.onclick=()=>{milestoneTab=b.dataset.milestone;render()});document.querySelectorAll('[data-complete]').forEach(b=>b.onchange=()=>{data.milestones[b.dataset.complete]={date:today()};persist();render()});document.querySelectorAll('[data-action="new"]').forEach(b=>b.onclick=()=>{editing=null;modal='client';render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=data.clients.find(c=>c.id===b.dataset.edit);modal='client';render()});document.querySelectorAll('[data-lost]').forEach(b=>b.onclick=()=>{editing=data.clients.find(c=>c.id===b.dataset.lost);modal='lost';render()});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{modal=null;editing=null;render()});document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{let f=$('clientform'),v=b.dataset.type;f.elements.type.value=v;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x.dataset.type===v));$('paymentfields').innerHTML=paymentFields({type:v,payment:0,billing:'monthly',contract:3,pifExpiration:''})});if($('clientform'))$('clientform').onsubmit=e=>{e.preventDefault();let f=e.currentTarget,z=Object.fromEntries(new FormData(f)),payment=Number(z.payment),sessions=Number(z.sessions),minutes=Number(z.minutes);if(!z.name.trim()||!Number.isFinite(payment)||payment<0||z.startDate>today())return alert('Please enter valid client information.');let obj={id:editing?.id||uid(),name:z.name.trim(),startDate:z.startDate,source:z.source,type:z.type,payment,billing:z.billing||'monthly',contract:Number(z.contract||0),sessions,minutes,pifExpiration:z.pifExpiration||'',lostDate:editing?.lostDate||null};if(editing){let i=data.clients.findIndex(c=>c.id===editing.id);data.clients[i]=obj}else data.clients.push(obj);persist();modal=null;editing=null;tab='portfolio';render()};if($('lostform'))$('lostform').onsubmit=e=>{e.preventDefault();let d=e.currentTarget.elements.lostDate.value;if(d<editing.startDate||d>today())return alert('Please choose a valid cancellation date.');let c=data.clients.find(c=>c.id===editing.id);c.lostDate=d;data.history.push({type:'lost',id:c.id,date:d});persist();modal=null;editing=null;render()};if($('metric'))$('metric').onchange=e=>{graphMetric=e.target.value;drawChart()};if($('range'))$('range').onchange=e=>{graphRange=e.target.value;drawChart()};if($('search'))$('search').oninput=e=>{search=e.target.value;let pos=e.target.selectionStart;render();$('search').focus();$('search').setSelectionRange(pos,pos)};if($('inactive'))$('inactive').onchange=e=>{showInactive=e.target.checked;render()}}
function chartValue(d){let cs=data.clients.filter(c=>activeAt(c,d));if(graphMetric==='revenue')return cs.filter(c=>c.type==='recurring').reduce((s,c)=>s+mrr(c),0);if(graphMetric==='hours')return cs.reduce((s,c)=>s+hours(c),0);let start=iso(new Date(date(d).getFullYear(),date(d).getMonth(),1));return data.clients.filter(c=>c.startDate>=start&&c.startDate<=d).length-data.clients.filter(c=>c.lostDate&&c.lostDate>=start&&c.lostDate<=d).length}
function drawChart(){let host=$('chart');if(!host)return;let n=Number(graphRange),end=date(today()),pts=[];for(let i=n-1;i>=0;i--){let d=new Date(end);d.setDate(d.getDate()-i);pts.push({d:iso(d),v:chartValue(iso(d))})}let prev=new Date(end);if(n===7)prev.setDate(prev.getDate()-7);else if(n===30)prev.setMonth(prev.getMonth()-1);else if(n===90)prev.setMonth(prev.getMonth()-3);else prev.setFullYear(prev.getFullYear()-1);let reference=chartValue(iso(prev));let values=pts.map(p=>p.v).concat(reference),min=Math.min(...values),max=Math.max(...values);if(max===min){max+=1;min-=1}let pad=(max-min)*.14;min-=pad;max+=pad;const W=680,H=240,L=58,R=15,T=15,B=30,xx=i=>L+i/(pts.length-1)*(W-L-R),yy=v=>T+(max-v)/(max-min)*(H-T-B);let path=pts.map((p,i)=>(i?'L':'M')+xx(i).toFixed(1)+' '+yy(p.v).toFixed(1)).join(' ');let lines='';for(let j=0;j<5;j++){let v=min+(max-min)*j/4,y=yy(v);lines+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#3C4553"/><text x="${L-8}" y="${y+4}" text-anchor="end" fill="#A6B1C0" font-size="11">${graphMetric==='revenue'?'$':''}${Math.abs(v)>=1000?(v/1000).toFixed(1)+'k':v.toFixed(graphMetric==='growth'?0:1)}</text>`}let ticks='';for(let j=0;j<5;j++){let i=Math.round((pts.length-1)*j/4);ticks+=`<text x="${xx(i)}" y="${H-6}" text-anchor="middle" fill="#A6B1C0" font-size="11">${date(pts[i].d).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</text>`}host.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${graphMetric} growth line chart">${lines}<line x1="${L}" x2="${W-R}" y1="${yy(reference)}" y2="${yy(reference)}" stroke="#FF6D77" stroke-width="1.7" stroke-dasharray="6 5"/><path d="${path}" fill="none" stroke="#82AFFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${xx(pts.length-1)}" cy="${yy(pts[pts.length-1].v)}" r="4" fill="#82AFFF"/>${ticks}</svg>`;$('chartnote').textContent='Blue: daily value. Red dashed reference: value at the end of the preceding equivalent window ('+fmt(iso(prev))+'). Net growth resets each calendar month. Past values are reconstructed from current client records; editing old payment or package terms will affect historical estimates.'}
render();
